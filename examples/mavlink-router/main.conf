# MAVLink Router example for one vehicle link and two local consumers.
# The vehicle/SITL sends into 0.0.0.0:14560; router fan-out sends telemetry to
# the GCS and the connector. The connector must listen on its own endpoint.

[General]
TcpServerPort = 5760
ReportStats = false

[UdpEndpoint qgroundcontrol]
Mode = Normal
Address = 127.0.0.1
Port = 14550

[UdpEndpoint utm_connector]
Mode = Normal
Address = 127.0.0.1
Port = 14551

[UdpEndpoint vehicle_input]
Mode = Server
Address = 0.0.0.0
Port = 14560
